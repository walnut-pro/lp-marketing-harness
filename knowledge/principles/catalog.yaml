- id: OPS-ELEMENT-TESTING
  stage: operation
  used_in:
  - build
  - operate
  scope: core
  title: 要素を1つずつ差し替えるテストを週単位で回し続け、勝ち要素を組み上げる
  statement: 画像・キャッチコピーなど要素を分けて、1回のテストでは1要素だけ変える。週ごと、または一定販売数ごと（例：1000個）に判定し、勝った要素を組み合わせて「最強のLP」にしていく。CVRを0.1%単位で積み上げる。
  rationale: 一度作って終わりではなく、更新し続けることでCVRの高いLPになるため。全要素を一度に変えると何が効いたかわからなくなるため。
  evidence:
  - この週は画像をやりましょうでこの週は文字をやりましょうとか常にサイトのアップデートカスタマイズやってます 1週間ごとに
  - 1000個売れた時点で一番効率が良いところを採用しようとかそう言うの常やってました
  - cvrを本当に0.1%ずつ改善していって…今では当初の本当に何倍にもなっている
  - 何を一番使えばお客さんに響くか そのパズルが組み合わさった最強のサイトができます
  applies_when: 公開後の運用全般
  anti_patterns:
  - 一度作ったLPを放置する
  - 複数要素を同時に変えて原因がわからなくなる
  - 判定基準を決めずにテストを始める
  check: 実験記録で、1実験あたりの変更要素が1つか。判定基準が事前に記録されているか。実験が継続的に回っているか
  check_type: process
  caveats:
  - 「1週間」「1000個」は大量に売れている事業での経験則。流量が少ない場合は、判定前に必要サンプル数を確認する
  merged_from:
  - CORE-013
  - FV-007
  - OPS-004
  - OPS-009
  confidence: high
  status: draft
  audit_notes:
  - 判定の統計ルールはソースに無い。Step 8 で ADR 化（GAP-AB-STATS）
