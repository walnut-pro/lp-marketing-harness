  - OPS-002
  confidence: high
  status: draft
- id: BASE-SELL-NOT-LOVE
  stage: strategy
  used_in:
  - brief
  - strategy
  - copy
  - review
  scope: core
  title: 「良い商品だから売れる」と考えず、売り方（成約）を最優先する
  statement: 商品の品質や成分への愛着を前面に出すのではなく、初見客が手に取るための見せ方・買いやすさを最優先で設計する。
  rationale: どんなに良い商品でも、まず手に取ってもらわなければ良さは伝わらないため。
  evidence:
  - 担当者が商品に熱量がめちゃくちゃあってこれいいんですよって言ってくる人たち もう絶対ダメなんですよ
  - そもそも手に取らないと売れないから
  applies_when: 常に
  anti_patterns:
  - 品質の良さを理由に割引・お試しを一切しない
  - 商品説明（成分・製法・開発秘話）ばかりでベネフィットがない
  check: 本文のうち商品スペック説明と顧客ベネフィットの比率（スペック偏重でないか）
  check_type: llm
  merged_from:
