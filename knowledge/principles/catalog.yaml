# 原則カタログ v0.3 — 知識の唯一の正本（single source of truth）
#
# このファイルを編集したら、次を実行して生成物を更新すること:
#   python3 scripts/validate_catalog.py && python3 scripts/build_context.py
# knowledge/context/ 以下は自動生成物。直接編集しない。
#
# 出典の扱い（ADR-0002）:
#   監査人の判断により、Gemini Notebook の回答（knowledge/raw/P1〜P9）を信頼できるデータとして扱う。
#   各原則の出典は merged_from（raw の ID）で辿る。Gemini の source 番号と timestamp は動画を特定できないため使わない。
#
# フィールド:
#   stage       主に属する工程
#   used_in     コンテキストとして渡す工程: brief / research / strategy / structure / copy / build / review / publish / operate
#   scope       core = 必ず適用 / optional = applies_when を満たす場合のみ適用
#   check_type  rule = 機械的に判定 / llm = LLMで判定 / metric = 計測データで判定 / process = 手順・記録で判定
#   caveats     生成エージェントに渡す注意。[RAG外] は責任者の一般知識による補足（監査人の承認対象）
#   audit_notes 監査・保守用の記録。エージェントには渡さない
#   confidence  high = 一般原則として繰り返し語られる / medium = 1事例から / low = Gemini の合成の比重が大きい
#   status      draft / approved / rejected（監査人の判定）

meta:
  version: '0.3'
  source_policy: trusted_gemini
  raw_items: 97
  merged_principles: 27
  reference_items: 8
  rejected_items: 1
  cases: 3
  gaps: 12
summary:
- 売るのは縦長1ページのLP。良し悪しはCVRだけで判断し、主観を入れない。
- ゼロから考えず、今売れている競合LPを複数集めて構成を真似し、それを上回る点を作る。
- ファーストビューに全力を注ぐ。初見客が一目で「買うと何が得られるか」と権威性がわかり、法令の範囲で最大限はっきり言い切る。
- 買いやすさを徹底する。初回はお試し価格、選択肢は1つ、クーポン入力なし、購入まで1ページで完結。
- 作って終わりにしない。FVの画像とコピーを方向性の違う4パターンで試し、1要素ずつ週単位でテストし続ける。CVRを確認するまで大きく集客しない。
principles:
- id: BASE-LP-FORMAT
  stage: structure
  used_in:
  - structure
  - build
  - review
  scope: core
  title: 縦長1ページのLPで売り、ブランドサイトでは売らない
  statement: 販売は遷移のない縦長1ページのLPで行う。ブランドサイト（公式サイト）とは別URL・別構成にし、広告の飛び先は必ずLPにする。
  rationale: 複数ページのサイトは購入までのクリックが多く、広告を流してもCVRが悪いため。
  evidence:
  - lpで売りますよ…縦長のページですよね あれで売りますそれが基本ですね
  - ブランドのサイトであそこは売れないんで…広告が出しても効率悪いから出して意味ない
  applies_when: 常に
  anti_patterns:
  - 広告の飛び先をブランドサイトのトップにする
  - 詳細説明やFAQを別ページに分ける
  check: 購入完了までのページ遷移が0回か。外部ページへのリンクが購入導線上にないか
  check_type: rule
  merged_from:
  - CORE-001
  - CORE-012
  - STRUC-001
  - STRUC-009
  confidence: high
  status: draft
- id: BASE-KPI-CVR
  stage: operation
  used_in:
  - operate
  scope: core
  title: LPの良し悪しはCVR（成約率）だけで判断する
  statement: LPの評価指標はCVRを最優先とし、見た目の好みやPV数では評価しない。
  rationale: CVRが2倍になれば同じ広告費で獲得数が2倍になり、利益が大きく変わるため。
  evidence:
  - lpで一番大切なのはコンバージョンレートです
  - 平均値は業界5%…10%に引き上げることができれば2倍効率いい
  applies_when: 常に
  anti_patterns:
  - デザインのかっこよさやPV数で評価する
  check: 実験の勝敗判定がCVRで行われているか
  check_type: metric
  caveats:
  - '[RAG外] CVRだけを追うと誇大表現や分かりにくい定期縛りでCVRを上げる方向に進むため、法令チェックと解約率・返品率・苦情を併せて監視する'
  merged_from:
  - CORE-002
  - OPS-001
  confidence: high
  status: draft
  audit_notes:
  - 「業界平均5%」は前提（流入元・成果の定義）不明の1発言。合格基準には使わない
  - OPS-001 の「10%を目指す」は例え話を目標化したもので、採用しない
- id: BASE-DATA-OVER-TASTE
  stage: operation
  used_in:
  - review
  - operate
  scope: core
  title: 主観を入れず、複数パターンを数値で機械的に選ぶ
  statement: 「かっこいい」「かわいい」などの主観で決めず、複数パターンを作ってCVRの数値だけで採用を決める。
  rationale: 主観による評価と売上は一致しないため。
  evidence:
  - 自分の主観って全く入れないですよね すごい機械的に作るんですよ
  - 機械的にその4つのパターンでどれが一番効果がいいか…数値ベースで選んでく
  applies_when: 常に
  anti_patterns:
  - 担当者や経営者の好みでデザイン・コピーを1つに決める
  check: 採用判断の記録に数値根拠があるか（主観的な理由のみの採用がないか）
  check_type: process
  merged_from:
