  - OFR-008
  - RISK-002
  confidence: high
  status: draft
- id: BASE-NO-LEAKY-BUCKET
  stage: operation
  used_in:
  - publish
  - operate
  scope: core
  title: LPのCVRが確認できるまで大きな集客をしない
  statement: 売り場としてのLPが整っていない（CVRが低い）段階で、広告やインフルエンサー案件に大きな予算を投じない。
  rationale: 穴の開いたバケツに水を入れるのと同じで、集客しても成約せず広告費が無駄になるため。
  evidence:
  - ちゃんとした売り場がない状態で案件やっていっぱいアクセス流しても誰も成約してない
  - 穴の開いたバケツにいくら水入れても漏れていっちゃう…まずそこをしっかり強いサイトを作ってからやっていきましょう
  applies_when: 集客を行うすべてのLP
  anti_patterns:
  - CVR未検証のまま広告予算を一気に投入する
  check: 公開手順に「少額配信でCVRを確認 → 予算増額」の段階があるか
  check_type: process
  merged_from:
  - CORE-011
  - FV-009
  - OPS-007
  - RISK-003
  confidence: high
  status: draft
- id: STR-IMITATE-WINNERS
  stage: research
  used_in:
  - research
  - strategy
  - structure
  scope: core
  title: 今売れている競合LPを複数集めて構成を真似し、それを上回る
  statement: 広告代理店への聞き取りや上場企業の通販LP（例：DUO）の調査で「今一番売れている商品」のLPを複数集め、構成を分析してその通りに作る。そのうえで初回割引・チャット窓口などの工夫で競合を上回る。ペルソナ設定やPASONAの法則などの理論には頼らない。
  rationale: 市場で結果が出ている構成を使う方が確実で速く、理論は現場で再現できないため。
  evidence:
  - 今一番売れている商品を広告代理店さんに聞いてください…その構成を分析してその通り作ってください
  - 売れてる上場企業のLPを真似します でより良いものを作ります
  - パソナの法則とかこのよくわかんないことをやらないです
  applies_when: LPの初期構成を決めるとき
  anti_patterns:
  - 独自の発想だけで一から構成を作る
  - ペルソナ設定やフレームワーク適用に時間をかける
  - 競合の劣化コピーで満足する
  check: 構成案に参照した競合LP（2件以上）と、各競合に対する上回りポイントが記録されているか
  check_type: process
  caveats:
  - '[RAG外] 真似るのは構成（セクションの種類と順番）と訴求の型まで。競合の文章・画像をそのまま使わない（著作権・不正競争）'
  merged_from:
  - CORE-006
  - STR-001
  - STR-002
  - STR-004
  - STRUC-002
  - COPY-006
  confidence: high
  status: draft
  audit_notes:
  - 競合LPの自動取得には一般サイトへのネットワーク接続が必要（footguns F-10）。MVPは手動入力
