- id: FV-TOP-PRIORITY
  stage: operation
  used_in:
  - copy
  - operate
  scope: core
  title: 改善はFVを最優先し、次に離脱が最も多い箇所（フォーム手前）に取り組む
  statement: FVはCVRを最も左右する場所として、制作でも改善テストでも最優先にする。次に、申込・予約フォーム手前など離脱が最も多い箇所を改善する。
  rationale: 最初に見る場所で価値が伝わらなければその先は読まれず、フォーム手前の離脱を減らせば直接CVRが上がるため。
  evidence:
  - トップのこのファーストビュー…とにかく命をかけてここをいいものにしたい
  - 予約をする画面までは行くけれどそこでやめちゃう…4コマ漫画を入れることで離脱がすごく減った
  applies_when: 改善の優先順位を決めるとき
  anti_patterns:
  - FVを後回しにして本文ばかり作り込む
  - 離脱の少ない中盤やフッターから改修する
  check: 改善テストの対象順が「FV → 計測上の離脱最大箇所」になっているか
  check_type: process
