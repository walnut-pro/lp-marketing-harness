- id: FV-LEGAL-MAX
  stage: copy
  used_in:
  - copy
  - review
  scope: core
  title: 薬機法・景表法の範囲内で、効果効能を最大限はっきり伝える
  statement: 法令違反となる表現（例：「塗るだけでシミが消える」）は絶対に使わない。一方で法令を恐れてぼかしすぎず、許される範囲で最大限具体的に効果効能を表現する。
  rationale: 違反は重大な事業リスクであり、ぼかしすぎると何の商品か伝わらずCVRが落ちるため。
