  scope: core
  title: 初回はお試し価格にし、リピートで利益を回収する（それが可能な原価構成にする）
  statement: 高額な定価で売らず、初回半額などのお試し価格にする。初回は原価と送料で赤字にならない程度に抑え、2回目以降のリピートで利益を出す。原価率が高すぎてお試し価格が作れない場合は、原価構成から見直す。
  rationale: 認知のない新規客にとって高い定価（例：27,000円）は試す壁が高すぎるため。原価が高いと、より安く作れる競合に負けるため。
  evidence:
  - 初めての人って2万7000円で試すかっていうとかなりそこでハードルになる
