- id: FV-FOUR-VARIANTS
  stage: copy
  used_in:
  - strategy
  - copy
  - build
  - operate
  scope: core
  title: FVの画像とキャッチコピーは方向性の違う4パターンを作ってテストする
  statement: FVのメイン画像（例：かわいい系・かっこいい系・起用人物の違い）とキャッチコピー（例：「真っ黒毛穴クレンジング」「黒い新しいクレンジング」）を、それぞれ方向性の異なる4パターン作り、同時に配信してCVRで選ぶ。
  rationale: どれが刺さるかは事前に判断できないため。
  evidence:
  - ファーストビューと言われる写真…大体4パターンで作るんですよね 違う方向性で
  - 4つくらい原稿を作って…どの言葉を使ったサイトが一番成約率が高いかを競うんですよ
  - 芸能人…乗せて4つのパターンのウェブサイトを作るんですよ 誰の画像を使った時に一番コンバージョンレート高いか
  applies_when: FVの制作・改善時
  anti_patterns:
  - 1パターンだけ作ってテストしない
  - 4パターンが言い回し違いだけで方向性が同じ
  check: FVの画像・コピーがそれぞれ4案あり、案同士の訴求の方向性が異なるか
  check_type: rule
  caveats:
  - '[RAG外] 芸能人・モデルの起用は契約済みの素材に限る。AI画像生成で実在人物に似せた画像を作らない（肖像権・パブリシティ権）'
  - 4パターンに流量を等分するため、流量が少ない場合は判定までの期間が長くなる
  merged_from:
  - STR-003
  - FV-005
  - FV-006
